<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Sign-Up Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Medical Sign-Up Form</h2>
    <form class="needs-validation" novalidate>

      <!-- Name -->
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
        <div class="invalid-feedback">Please enter your name.</div>
      </div>

      <!-- Medical Name -->
      <div class="mb-3">
        <label for="medicalName" class="form-label">Medical Name</label>
        <input type="text" class="form-control" id="medicalName" required>
        <div class="invalid-feedback">Please enter medical name.</div>
      </div>

      <!-- PAN Number -->
      <div class="mb-3">
        <label for="pan" class="form-label">PAN Number</label>
        <input type="text" class="form-control" id="pan" required>
        <div class="invalid-feedback">Please enter PAN number.</div>
      </div>

      <!-- License Number -->
      <div class="mb-3">
        <label for="license" class="form-label">License Number</label>
        <input type="text" class="form-control" id="license" required>
        <div class="invalid-feedback">Please enter license number.</div>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea class="form-control" id="address" rows="3" required></textarea>
        <div class="invalid-feedback">Please enter your address.</div>
      </div>

      <!-- Date of Birth -->
      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" required>
        <div class="invalid-feedback">Please select your date of birth.</div>
      </div>

      <!-- Submit Button -->
      <button class="btn btn-primary w-100" type="submit">Sign Up</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Bootstrap validation
    (function () {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
