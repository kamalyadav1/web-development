<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lakhan Medical</title>
  <style>
    body {
        padding: 0px;
        margin: 0px;
        padding-top: 80px;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        z-index: 1000;
        display: flex;
        padding: 10px;
        background-color: #0F4C81;
        justify-content: space-around;
        align-items: center;
        box-shadow: 7px 5px 15px -4px rgba(0, 0, 0, 0.75);
        -webkit-box-shadow: 7px 5px 15px -4px rgba(0, 0, 0, 0.75);
        -moz-box-shadow: 7px 5px 15px -4px rgba(0, 0, 0, 0.75);
    }

    .nav-items > ul > li {
        position: relative;
        display: inline;
        list-style: none;
        margin: 10px;
        padding: 10px 20px;
        cursor: pointer;
    }

    .nav-items > ul > li > a {
        color: white;
        text-decoration: none;
    }

    .nav-items > ul > li::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 0.17rem;
        background-color: #c52726;
        left: 0;
        bottom: 0;
        transform-origin: 0% 100%;
        transform: scaleX(0);
        transition: transform 0.3s ease;
    }

    .nav-items > ul > li:hover::after {
        transform: scaleX(1);
    }

    .nav-logo a,
    .nav-button a {
        color: white;
        list-style: none;
        text-decoration: none;
        display: flex;
    }

    .nav-logo {
        font-size: 32px;
    }

    .nav-button {
        background-color: #c52726;
        border-radius: 50px;
        position: relative;
        display: inline-block;
        overflow: hidden;
        cursor: pointer;
    }

    .anim-layer {
        position: absolute;
        top: 0;
        left: 50%;
        width: 0;
        height: 100%;
        background-color: white;
        transition: width 0.3s ease, left 0.3s ease;
    }

    .nav-button:hover .anim-layer {
        width: 100%;
        left: 0;
    }

    .nav-button:hover a {
        color: #141214;
    }

    .nav-button a {
        display: block;
        padding: 10px 20px;
        color: white;
        text-decoration: none;
        position: relative;
        z-index: 1;
    }

    #hamburger-menu,
    #hamburger-cross,
    #mobile-menu {
        display: none;
    }

    @media only screen and (max-width: 770px) {
        #mobile-menu {
            background-color: #c52726;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: transform 0.3s ease;
            transform: translateX(-100%);
            z-index: 2000;
        }

        .mobile-nav-items > ul {
            padding: 0px;
        }

        .mobile-nav-items > ul > li {
            text-align: center;
            position: relative;
            list-style: none;
            margin: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .mobile-nav-items > ul > li > a {
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .mobile-nav-items > ul > li::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 0.17rem;
            background-color: white;
            left: 0;
            bottom: 0;
            transform-origin: 0% 100%;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .mobile-nav-items > ul > li:hover::after {
            transform: scaleX(1);
        }

        .mobile-nav-button {
            background-color: #141214;
            border-radius: 50px;
            position: relative;
            display: inline-block;
            overflow: hidden;
            cursor: pointer;
            margin-top: 20px;
        }

        .mobile-nav-button .anim-layer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 0;
            height: 100%;
            background-color: white;
            transition: width 0.3s ease, left 0.3s ease;
        }

        .mobile-nav-button:hover .anim-layer {
            width: 100%;
            left: 0;
        }

        .mobile-nav-button:hover a {
            color: #141214;
        }

        .mobile-nav-button a {
            display: block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            position: relative;
            z-index: 1;
        }

        .nav-items > ul,
        .nav-button {
            display: none;
        }

        #hamburger-cross {
            display: block;
            color: white;
            cursor: pointer;
            font-size: 40px;
            position: absolute;
            top: 20px;
            right: 26px;
        }

        #hamburger-menu {
            display: block;
            color: white;
            cursor: pointer;
            font-size: 24px;
        }
    }
    </style>
</head>
<body>

    <div class="navbar">
      <div class="nav-logo">
        <a href="#">𝓛𝓪𝓴𝓱𝓪𝓷 𝓜𝓮𝓭𝓲𝓬𝓪𝓵</a>
      </div>
      <div class="nav-items">
        <ul>
          <li><a href="#"> Home </a></li>
          <li><a href="#"> Services </a></li>
          <!-- ✉️ Updated dynamic mailto link for Desktop layout -->
          <li><a href="ky3995018@gmail.com"> Contact </a></li>
        </ul>
      </div>
      <div class="nav-button">
        <div class="anim-layer"></div>
        <a href="#">Sign Up</a>
      </div>
      <div id="hamburger-menu">☰</div>
    </div>

    <div id="mobile-menu">
        <div id="hamburger-cross">✖</div>
        <div class="mobile-nav-items">
            <ul>
                <li><a href="#"> Home </a></li>
                <li><a href="https://onrender.com" target="_blank" rel="noopener noreferrer"> Medicines </a></li>

                <!-- ✉️ Updated dynamic mailto link for Mobile side menu layout -->
                <li><a href="ky3995018@gmail.com"> Contact </a></li>
            </ul>
        </div>
        <div class="mobile-nav-button">
            <div class="anim-layer"></div>
            <a href="#">Sign Up</a>
        </div>
    </div>

    <script>
    var getHubergerIcon = document.getElementById("hamburger-menu");
    var getHubergerCrossIcon = document.getElementById("hamburger-cross");
    var getMobileMenu = document.getElementById("mobile-menu");

    getHubergerIcon.addEventListener("click", function () {
        getMobileMenu.style.display = "flex";
        setTimeout(function () {
            getMobileMenu.style.transform = "translateX(0%)";
        }, 50);
    });

    getHubergerCrossIcon.addEventListener("click", function () {
        getMobileMenu.style.transform = "translateX(-100%)";
        setTimeout(function () {
            getMobileMenu.style.display = "none";
        }, 300);
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 770) {
            getMobileMenu.style.display = "none";
        }
    });
    </script>

</body>
</html>
