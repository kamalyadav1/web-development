<!DOCTYPE html>
<html>
<head>
    <title>Medicine List</title>
</head>
<body>
    <h1>Available Medicines</h1>
    <table border="1">
        <tr>
            <th>ID</th><th>Name</th><th>Description</th><th>Dosage</th>
            <th>Manufacturer</th><th>Expiry Date</th><th>Created At</th>
        </tr>
        {% for m in medicines %}
        <tr>
            <td>{{ m[0] }}</td>
            <td>{{ m[1] }}</td>
            <td>{{ m[2] }}</td>
            <td>{{ m[3] }}</td>
            <td>{{ m[4] }}</td>
            <td>{{ m[5] }}</td>
            <td>{{ m[6] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
